[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climada-toolkit"
version = "0.1.0"
description = "A toolbox of useful CLIMADA code snippets to copy and adapt."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10,<3.13"

testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["climada_toolbox*"]